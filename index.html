  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- UTILS: VIETNAMESE ACCENT REMOVER FOR ROBUST SEARCH ---
    function removeVietnameseAccents(str) {
      if (!str) return '';
      return str
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/đ/g, 'd')
        .replace(/Đ/g, 'D')
        .toLowerCase()
        .trim();
    }

    function matchesSearch(target, keyword) {
      if (!keyword || !keyword.trim()) return true;
      if (!target) return false;
      return removeVietnameseAccents(target).includes(removeVietnameseAccents(keyword));
    }

    // --- UTILS: URL & EMBED HELPER ---
    function parseEmbedUrl(url) {
      if (!url || !url.trim()) return { canEmbed: false, embedUrl: null, originalUrl: '' };
      const cleanUrl = url.trim();
      
      // YouTube
      const ytMatch = cleanUrl.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
      if (ytMatch && ytMatch[1]) {
        return {
          canEmbed: true,
          embedUrl: `https://www.youtube-nocookie.com/embed/${ytMatch[1]}?rel=0&modestbranding=1`,
          originalUrl: cleanUrl,
        };
      }

      // PhET
      if (cleanUrl.includes('phet.colorado.edu')) {
        return { canEmbed: true, embedUrl: cleanUrl, originalUrl: cleanUrl };
      }

      // Canva
      if (cleanUrl.includes('canva.com/design')) {
        let canvaEmbed = cleanUrl;
        if (!canvaEmbed.includes('embed')) canvaEmbed = canvaEmbed.replace(/\/view(\?.*)?$/, '/view?embed');
        return { canEmbed: true, embedUrl: canvaEmbed, originalUrl: cleanUrl };
      }

      // Google Drive
      if (cleanUrl.includes('drive.google.com')) {
        const dMatch = cleanUrl.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
        if (dMatch && dMatch[1]) {
          return { canEmbed: true, embedUrl: `https://drive.google.com/file/d/${dMatch[1]}/preview`, originalUrl: cleanUrl };
        }
      }

      // Office PowerPoint Online
      if (cleanUrl.includes('onedrive.live.com') || cleanUrl.includes('officeapps.live.com')) {
        return { canEmbed: true, embedUrl: cleanUrl, originalUrl: cleanUrl };
      }

      return { canEmbed: false, embedUrl: null, originalUrl: cleanUrl };
    }

    // --- COMPONENT: KATEX MATH FORMULA ---
    const MathFormula = ({ latex, displayMode = false, className = '' }) => {
      const spanRef = useRef(null);
      useEffect(() => {
        if (!spanRef.current) return;
        if (window.katex) {
          try {
            window.katex.render(latex, spanRef.current, { displayMode, throwOnError: false });
          } catch (e) {
            spanRef.current.innerText = latex;
          }
        } else {
          spanRef.current.innerText = latex;
        }
      }, [latex, displayMode]);

      return <span ref={spanRef} className={`font-mono text-physics-dark ${displayMode ? 'my-2 block text-center' : ''} ${className}`} />;
    };

    // --- COMPONENT: PHYSICS SIMULATOR CANVASES (10, 11, 12) ---
    const InteractiveSimulator = ({ type }) => {
      const [isRunning, setIsRunning] = useState(false);
      const canvasRef = useRef(null);

      // Params
      const [v0, setV0] = useState(2);
      const [acc, setAcc] = useState(1.5);
      const [mass, setMass] = useState(2);
      const [force, setForce] = useState(8);
      const [friction, setFriction] = useState(0.1);
      const [amp, setAmp] = useState(5);
      const [omega, setOmega] = useState(3);
      const [voltage, setVoltage] = useState(12);
      const [resistance, setResistance] = useState(24);
      const [power, setPower] = useState(800);
      const [waterMass, setWaterMass] = useState(500);
      const [gasVol, setGasVol] = useState(5);
      const [gasTemp, setGasTemp] = useState(300);
      const [time, setTime] = useState(0);

      const handleReset = () => {
        setIsRunning(false);
        setTime(0);
      };

      useEffect(() => {
        let animId;
        let last = performance.now();

        const loop = (now) => {
          const dt = Math.min((now - last) / 1000, 0.05);
          last = now;
          if (isRunning) setTime(t => t + dt);

          const canvas = canvasRef.current;
          if (canvas) {
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Motion 10
            if (type === 'motion10') {
              const d = v0 * time + 0.5 * acc * time * time;
              const v = v0 + acc * time;
              ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 4;
              ctx.beginPath(); ctx.moveTo(30, 130); ctx.lineTo(canvas.width - 30, 130); ctx.stroke();
              const px = Math.min(Math.max(40 + (d % 80) * ((canvas.width - 100) / 80), 40), canvas.width - 60);
              ctx.fillStyle = '#1e3a8a'; ctx.fillRect(px - 20, 100, 40, 24);
              ctx.fillStyle = '#334155'; ctx.beginPath(); ctx.arc(px - 10, 126, 5, 0, Math.PI*2); ctx.arc(px + 10, 126, 5, 0, Math.PI*2); ctx.fill();
              ctx.fillStyle = '#0d9488'; ctx.font = '11px sans-serif'; ctx.fillText(`v = ${v.toFixed(1)} m/s, d = ${d.toFixed(1)} m`, 40, 30);
            }
            // 2. Newton 10
            else if (type === 'newton10') {
              const f_fric = friction * mass * 9.8;
              const netF = Math.max(force - f_fric, 0);
              const a = netF / mass;
              const d = 0.5 * a * time * time;
              ctx.fillStyle = '#e2e8f0'; ctx.fillRect(20, 120, canvas.width - 40, 20);
              const px = Math.min(40 + (d % 60) * ((canvas.width - 120) / 60), canvas.width - 80);
              ctx.fillStyle = '#1e3a8a'; ctx.fillRect(px - 25, 85, 50, 35);
              ctx.fillStyle = '#ffffff'; ctx.font = '10px sans-serif'; ctx.fillText(`m=${mass}kg`, px - 18, 106);
              ctx.fillStyle = '#0d9488'; ctx.font = '11px sans-serif'; ctx.fillText(`a = F/m = ${(netF/mass).toFixed(2)} m/s²`, 40, 30);
            }
            // 3. Oscillator 11
            else if (type === 'oscillator11') {
              const xVal = amp * Math.cos(omega * time);
              const eqX = 220; const massX = eqX + xVal * 12;
              ctx.strokeStyle = '#64748b'; ctx.lineWidth = 2;
              ctx.beginPath(); ctx.moveTo(40, 90);
              for (let i = 0; i < 16; i++) ctx.lineTo(40 + i * ((massX - 55) / 16) + (massX - 55) / 32, 90 + (i % 2 === 0 ? -10 : 10));
              ctx.lineTo(massX - 15, 90); ctx.stroke();
              ctx.fillStyle = '#2563eb'; ctx.fillRect(massX - 15, 75, 30, 30);
              ctx.fillStyle = '#ef4444'; ctx.fillText(`x = ${xVal.toFixed(1)} cm`, 40, 30);
            }
            // 4. Ohm 11
            else if (type === 'ohm11') {
              const current = (voltage / resistance).toFixed(2);
              ctx.strokeStyle = '#1e3a8a'; ctx.lineWidth = 3;
              ctx.strokeRect(50, 40, 240, 90);
              ctx.fillStyle = '#0d9488'; ctx.font = 'bold 12px sans-serif'; ctx.fillText(`I = U/R = ${voltage}V / ${resistance}Ω = ${current} A`, 50, 25);
            }
            // 5. Heat 12
            else if (type === 'heat12') {
              const dM = Math.min((power * time) / 2260, waterMass);
              ctx.fillStyle = '#60a5fa'; ctx.fillRect(80, 60, 100, 80);
              ctx.fillStyle = '#0d9488'; ctx.font = '12px sans-serif';
              ctx.fillText(`L = (P·t)/Δm ≈ 2.26 × 10⁶ J/kg (Đã hóa hơi: ${dM.toFixed(1)}g)`, 40, 30);
            }
            // 6. Gas 12
            else if (type === 'gas12') {
              const pAtm = ((0.08 * gasTemp) / gasVol).toFixed(2);
              ctx.strokeStyle = '#334155'; ctx.lineWidth = 2; ctx.strokeRect(60, 45, 200, 80);
              ctx.fillStyle = '#eff6ff'; ctx.fillRect(60, 45, (gasVol / 10) * 200, 80);
              ctx.fillStyle = '#0f2b5c'; ctx.font = 'bold 12px sans-serif';
              ctx.fillText(`P = ${pAtm} atm, V = ${gasVol} L, T = ${gasTemp} K => p·V = ${(pAtm * gasVol).toFixed(1)}`, 40, 25);
            }
          }
          animId = requestAnimationFrame(loop);
        };
        animId = requestAnimationFrame(loop);
        return () => cancelAnimationFrame(animId);
      }, [isRunning, type, v0, acc, mass, force, friction, amp, omega, voltage, resistance, power, waterMass, gasVol, gasTemp, time]);

      return (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden my-3">
          <div className="bg-slate-50 px-4 py-2 border-b border-slate-200 flex justify-between items-center text-xs">
            <span className="font-bold text-physics-navy flex items-center gap-1.5">
              <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
              Thực hành mô phỏng số học tương tác
            </span>
            <div className="space-x-1.5">
              <button
                onClick={() => setIsRunning(!isRunning)}
                className={`px-3 py-1 rounded text-white font-medium ${isRunning ? 'bg-amber-600' : 'bg-emerald-600'}`}
              >
                {isRunning ? 'Tạm dừng ⏸' : 'Chạy ▶'}
              </button>
              <button onClick={handleReset} className="px-2.5 py-1 bg-slate-200 hover:bg-slate-300 rounded text-slate-700">
                Làm lại ↺
              </button>
            </div>
          </div>
          <div className="p-2 bg-slate-100 flex justify-center">
            <canvas ref={canvasRef} width={500} height={160} className="bg-white rounded border border-slate-200 max-w-full" />
          </div>
          <div className="p-3 bg-white border-t border-slate-200 grid grid-cols-2 gap-3 text-xs">
            {type === 'motion10' && (
              <>
                <div><span>v₀ (m/s): <strong>{v0}</strong></span><input type="range" min="0" max="8" step="0.5" value={v0} onChange={e=>setV0(parseFloat(e.target.value))} className="w-full" /></div>
                <div><span>a (m/s²): <strong>{acc}</strong></span><input type="range" min="-2" max="4" step="0.5" value={acc} onChange={e=>setAcc(parseFloat(e.target.value))} className="w-full" /></div>
              </>
            )}
            {type === 'newton10' && (
              <>
                <div><span>Lực F (N): <strong>{force}</strong></span><input type="range" min="2" max="15" value={force} onChange={e=>setForce(parseFloat(e.target.value))} className="w-full" /></div>
                <div><span>Khối lượng m (kg): <strong>{mass}</strong></span><input type="range" min="1" max="5" value={mass} onChange={e=>setMass(parseFloat(e.target.value))} className="w-full" /></div>
              </>
            )}
            {type === 'oscillator11' && (
              <>
                <div><span>Biên độ A (cm): <strong>{amp}</strong></span><input type="range" min="2" max="8" value={amp} onChange={e=>setAmp(parseFloat(e.target.value))} className="w-full" /></div>
                <div><span>Tần số góc ω (rad/s): <strong>{omega}</strong></span><input type="range" min="1" max="6" value={omega} onChange={e=>setOmega(parseFloat(e.target.value))} className="w-full" /></div>
              </>
            )}
            {type === 'ohm11' && (
              <>
                <div><span>Hiệu điện thế U (V): <strong>{voltage}</strong></span><input type="range" min="0" max="24" value={voltage} onChange={e=>setVoltage(parseFloat(e.target.value))} className="w-full" /></div>
                <div><span>Điện trở R (Ω): <strong>{resistance}</strong></span><input type="range" min="6" max="60" value={resistance} onChange={e=>setResistance(parseFloat(e.target.value))} className="w-full" /></div>
              </>
            )}
            {type === 'heat12' && (
              <>
                <div><span>Công suất P (W): <strong>{power}</strong></span><input type="range" min="300" max="1500" step="50" value={power} onChange={e=>setPower(parseFloat(e.target.value))} className="w-full" /></div>
                <div><span>Nước (g): <strong>{waterMass}</strong></span><input type="range" min="200" max="800" step="50" value={waterMass} onChange={e=>setWaterMass(parseFloat(e.target.value))} className="w-full" /></div>
              </>
            )}
            {type === 'gas12' && (
              <>
                <div><span>Thể tích V (L): <strong>{gasVol}</strong></span><input type="range" min="2" max="9" step="0.5" value={gasVol} onChange={e=>setGasVol(parseFloat(e.target.value))} className="w-full" /></div>
                <div><span>Nhiệt độ T (K): <strong>{gasTemp}</strong></span><input type="range" min="250" max="450" step="10" value={gasTemp} onChange={e=>setGasTemp(parseInt(e.target.value))} className="w-full" /></div>
              </>
            )}
          </div>
        </div>
      );
    };

    // --- INITIAL DATA AS REQUIRED IN SECTION 13 & 4 ---
    const INITIAL_TEXTBOOKS_DATA = [
      { id: 'ket_noi_tri_thuc', name: 'Kết nối tri thức với cuộc sống', publisher: 'NXB Giáo dục Việt Nam', isDefault: true },

    const INITIAL_CHAPTERS_DATA = [

      { id: 'c10_2', grade: 10, textbookId: 'ket_noi_tri_thuc', name: 'Động học', order: 2, isSpecialTopic: false },
      { id: 'c10_3', grade: 10, textbookId: 'ket_noi_tri_thuc', name: 'Động lực học', order: 3, isSpecialTopic: false },
      { id: 'c10_4', grade: 10, textbookId: 'ket_noi_tri_thuc', name: 'Công – năng lượng – công suất', order: 4, isSpecialTopic: false },
      { id: 'c10_5', grade: 10, textbookId: 'ket_noi_tri_thuc', name: 'Động lượng', order: 5, isSpecialTopic: false },
      { id: 'c10_6', grade: 10, textbookId: 'ket_noi_tri_thuc', name: 'Chuyển động tròn', order: 6, isSpecialTopic: false },
      { id: 'c10_7', grade: 10, textbookId: 'ket_noi_tri_thuc', name: 'Biến dạng của vật rắn', order: 7, isSpecialTopic: false },
      { id: 'c10_sp', grade: 10, textbookId: 'ket_noi_tri_thuc', name: 'Chuyên đề học tập Vật lí 10', order: 8, isSpecialTopic: true },

      // Vật lí 11
      { id: 'c11_1', grade: 11, textbookId: 'ket_noi_tri_thuc', name: 'Dao động', order: 1, isSpecialTopic: false },
      { id: 'c11_2', grade: 11, textbookId: 'ket_noi_tri_thuc', name: 'Sóng', order: 2, isSpecialTopic: false },

      { id: 'c11_4', grade: 11, textbookId: 'ket_noi_tri_thuc', name: 'Dòng điện và mạch điện', order: 4, isSpecialTopic: false },
      { id: 'c11_sp', grade: 11, textbookId: 'ket_noi_tri_thuc', name: 'Chuyên đề học tập Vật lí 11', order: 5, isSpecialTopic: true },

      // Vật lí 12
      { id: 'c12_1', grade: 12, textbookId: 'ket_noi_tri_thuc', name: 'Vật lí nhiệt', order: 1, isSpecialTopic: false },
      { id: 'c12_2', grade: 12, textbookId: 'ket_noi_tri_thuc', name: 'Khí lí tưởng', order: 2, isSpecialTopic: false },
      { id: 'c12_3', grade: 12, textbookId: 'ket_noi_tri_thuc', name: 'Từ trường và cảm ứng điện từ', order: 3, isSpecialTopic: false },
      { id: 'c12_4', grade: 12, textbookId: 'ket_noi_tri_thuc', name: 'Vật lí hạt nhân', order: 4, isSpecialTopic: false },
      { id: 'c12_sp', grade: 12, textbookId: 'ket_noi_tri_thuc', name: 'Chuyên đề học tập Vật lí 12', order: 5, isSpecialTopic: true },
    ];

    const INITIAL_LESSONS_DATA = [
      // 1. Lớp 10: Chuyển động thẳng biến đổi đều
      {
        id: 'lesson_10_1',
        grade: 10,

          skills: ['Vẽ và đọc đồ thị v-t; đo thời gian bằng cổng quang điện để tính gia tốc.'],
          expectedOutcomes: ['Vận dụng giải bài toán quãng đường phanh an toàn trong thực tế giao thông.']
        },
        keyKnowledge: {

            'Nhanh dần đều: a cùng hướng v (a · v > 0); Chậm dần đều: a ngược hướng v (a · v < 0).'
          ],
          laws: ['Độ biến thiên vận tốc tỉ lệ thuận với thời gian chuyển động.'],
          formulas: [
            { name: 'Công thức vận tốc', latex: 'v = v_0 + a \\cdot t', explanation: 'v: vận tốc; v₀: vận tốc đầu; a: gia tốc', unit: 'm/s, m/s², s', applicability: 'a = const' },
            { name: 'Độ dịch chuyển', latex: 'd = v_0 t + \\frac{1}{2} a t^2', explanation: 'd: độ dịch chuyển', unit: 'm', applicability: 'Hệ quy chiếu thẳng' },
            { name: 'Hệ thức độc lập thời gian', latex: 'v^2 - v_0^2 = 2 \\cdot a \\cdot d', explanation: 'Liên hệ v, a, d không có biến thời gian t', unit: 'm/s, m/s², m', applicability: 'Mọi thời điểm' }
          ],

      // 2. Lớp 10: Định luật II Newton
      {

        authorName: 'Ths: Lê Long - QT',
        isSample: true,

                    </div>
                  ) : (
                    <div className="aspect-video w-full rounded-lg bg-slate-800 flex items-center justify-center text-white text-xs mb-3">
                      <a href={activeVideoModal.url} target="_blank" rel="noreferrer" className="px-4 py-2 bg-teal-600 rounded font-bold">Mở video gốc ↗</a>
                    </div>
                  );
                })()}
                <p className="text-xs text-slate-600">{activeVideoModal.description}</p>
                <div className="pt-3 mt-3 border-t flex justify-end">
                  <button onClick={() => setActiveVideoModal(null)} className="px-4 py-1.5 bg-slate-800 text-white rounded text-xs">Đóng</button>
                </div>
              </div>
            </div>
          )}

          {/* EDIT/CREATE RESOURCE MODAL IN TEACHER PORTAL */}
          {editingResource && (
            <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-2xl w-full p-6 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center pb-3 border-b mb-4">
                  <h3 className="font-bold text-base text-slate-900">{editingResource.title ? 'Sửa học liệu' : 'Thêm học liệu mới'}</h3>
                  <button onClick={() => setEditingResource(null)} className="text-xl font-bold text-slate-400">✕</button>
                </div>

                <div className="flex rounded bg-slate-100 p-1 mb-4 text-xs font-semibold">
                  <button onClick={() => setCreateMode('upload')} className={`flex-1 py-1 rounded ${createMode === 'upload' ? 'bg-white shadow text-physics-navy' : 'text-slate-600'}`}>📤 Tải tệp</button>
                  <button onClick={() => setCreateMode('link')} className={`flex-1 py-1 rounded ${createMode === 'link' ? 'bg-white shadow text-physics-navy' : 'text-slate-600'}`}>🔗 Dán link</button>
                  <button onClick={() => setCreateMode('compose')} className={`flex-1 py-1 rounded ${createMode === 'compose' ? 'bg-white shadow text-physics-navy' : 'text-slate-600'}`}>✍ Soạn công thức</button>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block font-semibold mb-1">Tiêu đề học liệu *:</label>
                    <input type="text" value={editingResource.title} onChange={e => setEditingResource({ ...editingResource, title: e.target.value })} className="w-full border p-2 rounded" />
                  </div>
                  <div>
                    <label className="block font-semibold mb-1">Mô tả học liệu *:</label>
                    <textarea rows={2} value={editingResource.description} onChange={e => setEditingResource({ ...editingResource, description: e.target.value })} className="w-full border p-2 rounded" />
                  </div>

                  {createMode === 'upload' && (
                    <div className="p-3 bg-slate-50 border rounded-lg">
                      <label className="block font-semibold mb-1">Tải tệp (PDF, Word, PPTX, Excel, MP4):</label>
                      <input type="file" onChange={handleSimulatedUpload} className="w-full text-xs" />
                      {uploadProgress !== null && (
                        <div className="mt-2">
                          <div className="w-full bg-slate-200 rounded-full h-2">
                            <div className="bg-teal-600 h-2 rounded-full" style={{ width: `${uploadProgress}%` }}></div>
                          </div>
                          <span className="text-[10px] text-teal-700 font-bold mt-1 block">Tiến độ: {uploadProgress}%</span>
                        </div>
                      )}
                      {uploadError && <p className="text-rose-600 text-[11px] mt-1">{uploadError}</p>}
                    </div>
                  )}

                  {createMode === 'link' && (
                    <div>
                      <label className="block font-semibold mb-1">Đường dẫn URL (YouTube/PhET/Canva/PPT):</label>
                      <input type="url" value={editingResource.url || ''} onChange={e => setEditingResource({ ...editingResource, url: e.target.value })} className="w-full border p-2 rounded" />
                    </div>
                  )}

                  {createMode === 'compose' && (
                    <div>
                      <label className="block font-semibold mb-1">Công thức KaTeX:</label>
                      <input type="text" value={editingResource.url || ''} onChange={e => setEditingResource({ ...editingResource, url: e.target.value })} className="w-full border p-2 rounded font-mono" />
                      {editingResource.url && <div className="p-2 border rounded mt-1 text-center"><MathFormula latex={editingResource.url} displayMode={true} /></div>}
                    </div>
                  )}

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-semibold mb-1">Loại học liệu:</label>
                      <select value={editingResource.type} onChange={e => setEditingResource({ ...editingResource, type: e.target.value })} className="w-full border p-2 rounded">
                        <option value="experiment">Thí nghiệm thực</option>
                        <option value="simulation">Mô phỏng tương tác</option>
                        <option value="video_experiment">Video thí nghiệm</option>
                        <option value="video_lesson">Video bài học</option>
                        <option value="document">Tài liệu</option>
                        <option value="presentation">Slide trình chiếu Canva/PPTX</option>
                        <option value="worksheet">Phiếu học tập</option>
                      </select>
                    </div>
                    <div>
                      <label className="block font-semibold mb-1">Khối lớp:</label>
                      <select value={editingResource.grade} onChange={e => setEditingResource({ ...editingResource, grade: parseInt(e.target.value) })} className="w-full border p-2 rounded">
                        <option value={10}>Lớp 10</option>
                        <option value={11}>Lớp 11</option>
                        <option value={12}>Lớp 12</option>
                      </select>
                    </div>
                  </div>

                  {/* Multi-lesson linking checklist (Requirement 1 & 6) */}
                  <div>
                    <label className="block font-semibold mb-1">Liên kết với bài học (1 học liệu có thể liên kết nhiều bài):</label>
                    <div className="max-h-28 overflow-y-auto border rounded p-2 space-y-1">
                      {lessons.map(les => (
                        <label key={les.id} className="flex items-center space-x-2 cursor-pointer text-[11px]">
                          <input
                            type="checkbox"
                            checked={editingResource.linkedLessonIds.includes(les.id)}
                            onChange={e => {
                              const next = e.target.checked
                                ? [...editingResource.linkedLessonIds, les.id]
                                : editingResource.linkedLessonIds.filter(id => id !== les.id);
                              setEditingResource({ ...editingResource, linkedLessonIds: next });
                            }}
                          />
                          <span>Lớp {les.grade}: {les.title}</span>
                        </label>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="pt-4 mt-4 border-t flex justify-between items-center text-xs">
                  <button onClick={() => setEditingResource(null)} className="px-3 py-1.5 border rounded">Hủy</button>
                  <div className="space-x-2">
                    <button onClick={() => handleSaveResource(editingResource, 'draft')} className="px-3 py-1.5 bg-slate-200 text-slate-800 rounded font-bold">Lưu nháp</button>
                    <button onClick={() => handleSaveResource(editingResource, 'published')} className="px-4 py-1.5 bg-teal-600 text-white rounded font-bold">Xuất bản ngay ✓</button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* FIREBASE MODAL */}
          {showFirebaseModal && (
            <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 text-xs space-y-4">
                <div className="flex justify-between items-center pb-2 border-b">
                  <h3 className="font-bold text-sm">Cấu hình Đám mây Firebase</h3>
                  <button onClick={() => setShowFirebaseModal(false)} className="text-xl font-bold text-slate-400">✕</button>
                </div>
                <div className="p-3 bg-amber-50 border border-amber-200 rounded text-amber-900">
                  <p className="font-bold">Đang ở Chế độ Bản xem trước (Preview Mode)</p>
                  <p className="mt-1">Tất cả chức năng hoạt động trọn vẹn trong trình duyệt. Để kết nối Firebase Firestore và Storage trực tuyến, vui lòng thêm các biến môi trường vào tệp .env.</p>
                </div>
                <div className="flex justify-end">
                  <button onClick={() => setShowFirebaseModal(false)} className="px-4 py-2 bg-physics-navy text-white rounded font-bold">Đã hiểu</button>
                </div>
              </div>
            </div>
          )}

          {/* REPORT MODAL */}
          {reportModalItem && (
            <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
              <div className="bg-white rounded-xl max-w-md w-full p-6 text-xs space-y-3">
                <h3 className="font-bold text-sm text-rose-700">🚩 Báo lỗi học liệu: {reportModalItem.title}</h3>
                <p className="text-slate-500">Mô tả lỗi hoặc sự cố liên kết để ban quản trị kiểm tra.</p>
                <textarea rows={3} placeholder="Mô tả lỗi..." className="w-full border p-2 rounded" />
                <div className="flex justify-end space-x-2 pt-2">
                  <button onClick={() => setReportModalItem(null)} className="px-3 py-1.5 border rounded">Hủy</button>
                  <button onClick={() => { alert('Cảm ơn bạn đã gửi báo cáo lỗi!'); setReportModalItem(null); }} className="px-4 py-1.5 bg-rose-600 text-white rounded font-bold">Gửi</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Render the React application
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
